name: Build Godot Containers

# CI scope is narrowed to building and pushing the Docker images only (§5.6).
# The RAM-heavy SCons artifact builds and the GitHub Release upload run LOCALLY
# on the 16-core host via `build-godot.py release --jobs 10`, because a
# GitHub-hosted runner cannot satisfy the memory/time budget. There is no
# artifact-build job and no Release job here, and the previous hardcoded
# `<version>-custom-1` release tag has been removed.

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Image version tag (e.g. 4.7)'
        required: false
        default: '4.7'
      container_types:
        description: 'Container types to build (comma-separated: base,linux,windows,android,web or all)'
        required: false
        default: 'all'

env:
  REGISTRY: ghcr.io
  USERNAME: nongvantinh

jobs:
  containers:
    name: Build & push Godot container images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    env:
      # Inputs go into env vars; shell steps reference them — never inline.
      GODOT_VERSION: ${{ github.event.inputs.godot_version || '4.7' }}
      CONTAINER_TYPES: ${{ github.event.inputs.container_types || 'all' }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          submodules: recursive

      - name: Set up Python via uv
        uses: astral-sh/setup-uv@38f3f104447c67c051c4a08e39b64a148898af3a # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ env.USERNAME }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Write config.toml
        run: |
          cat > config.toml << EOF
          registry = "ghcr.io"
          username = "nongvantinh"
          godot_version = "${GODOT_VERSION}"

          [[platforms]]
          name = "linux"
          image = "ghcr.io/nongvantinh/godot-linux:${GODOT_VERSION}"
          scons_flags = "platform=linuxbsd"
          EOF

      - name: Build & push container images
        env:
          # build-godot.py reads GHCR_PAT for the in-tool push login.
          GHCR_PAT: ${{ secrets.GITHUB_TOKEN }}
        run: |
          uv run python build-godot.py containers \
            --type "$CONTAINER_TYPES" \
            --version "$GODOT_VERSION" \
            --push
